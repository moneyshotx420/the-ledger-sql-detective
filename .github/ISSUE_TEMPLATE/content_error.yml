name: Content error
description: A lesson, hint, clue or story line is wrong, unclear or misleading.
title: "[Content]: "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Wrong SQL advice is the most important thing to fix in a game that teaches SQL. Thank you for flagging it.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of content is it?
      options:
        - SQL Academy lesson
        - Case lead (lesson text or example)
        - Hint
        - Red herring explanation
        - Clue card or story text
        - Walkthrough or documentation
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which one?
      description: For example, "Academy, HAVING lesson, second slip" or "Case 1, lead 3".
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What does it say?
      description: Quote the text or the query.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong with it?
      description: If it is SQL behaviour, say what really happens, and on which engine (the game uses SQLite).
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
